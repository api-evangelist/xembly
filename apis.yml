name: Xembly
description: Xembly was a Seattle-based enterprise AI company (2020-2024) whose assistant,
  Xena, acted as an automated "chief of staff" for knowledge workers - scheduling meetings,
  taking meeting notes, and tracking action items and tasks over email and Slack. Spun
  out of Madrona Venture Labs by Pete Christothoulou, Jason Flaks, and Peter Francis,
  and backed by Lightspeed Venture Partners, Norwest Venture Partners ($15M Series A),
  and Seven Peaks Ventures, Xembly discontinued its customer-facing services on June
  1, 2024. It never published a public developer API, and the xembly.com domain has
  since lapsed to an unrelated operator.
